<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    /* 余白とスクロールバーを完全に消す設定 */
    body { margin: 0; padding: 0; overflow: hidden; background-color: transparent; }
    /* 動画を画面サイズにピッタリ合わせる設定 */
    video { width: 100vw; height: 100vh; object-fit: cover; }
  </style>
</head>
<body>
  <video src="final.webm" autoplay loop muted playsinline></video>
</body>
</html>
